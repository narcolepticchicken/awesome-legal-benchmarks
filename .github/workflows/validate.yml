name: Validate catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical data and generated views
        run: |
          python scripts/validate_catalog.py
          python scripts/generate_catalog.py --check
          python -m unittest discover -s tests -v
      - name: Verify checked resource inventory
        run: python scripts/check_resources.py --check-snapshot
